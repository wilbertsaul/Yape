# Nota: para la emisión inicial del certificado con el webroot de certbot,
# comenta temporalmente el bloque "listen 443 ssl" hasta que fullchain.pem exista.

server {
    listen 80;
    server_name altoque.jemigra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name altoque.jemigra.com;

    ssl_certificate /etc/letsencrypt/live/altoque.jemigra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altoque.jemigra.com/privkey.pem;

    root /var/www/AlToque/public;
    index index.php index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass altoque_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
